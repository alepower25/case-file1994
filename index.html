// ── TEXTURES ──────────────────────────────────────────────────────────
function mkWall(w,h){
  const o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');
  x.fillStyle='#2c2318';x.fillRect(0,0,w,h);
  for(let i=0;i<w*h*.22;i++){const b=(Math.random()-.5)*20;x.fillStyle=`rgba(${142+b|0},${115+b|0},${88+b|0},0.2)`;x.fillRect(Math.random()*w,Math.random()*h,Math.random()*2+.5,Math.random()*2+.5);}
  x.strokeStyle='rgba(0,0,0,0.32)';x.lineWidth=.8;
  for(let y=12;y<h;y+=15){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();}
  for(let i=10;i<w;i+=22){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();}
  x.fillStyle='rgba(255,255,255,0.04)';x.fillRect(0,0,w,2);
  x.fillStyle='rgba(0,0,0,0.38)';x.fillRect(0,h-4,w,4);
  return o;
}
function mkFloor(w,h){
  const o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');
  x.fillStyle='#221a10';x.fillRect(0,0,w,h);
  for(let tx=0;tx<w/20+1;tx++)for(let ty=0;ty<h/20+1;ty++){const b=(Math.sin(tx*2.1+ty*1.9)*8)|0;x.fillStyle=`rgb(${36+b},${27+b},${16+b})`;x.fillRect(tx*20+.5,ty*20+.5,19,19);}
  for(let i=0;i<w*h*.08;i++){x.fillStyle=`rgba(255,240,200,${Math.random()*.025})`;x.fillRect(Math.random()*w,Math.random()*h,1,1);}
  for(let s=0;s<2;s++){const gx=Math.random()*w,gy=Math.random()*h,g=x.createRadialGradient(gx,gy,0,gx,gy,14+Math.random()*10);g.addColorStop(0,'rgba(48,4,4,0.28)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);}
  return o;
}

function resolve(e){for(let i=0;i<4;i++){let ok=true;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const tx=(e.x/TILE|0)+dx,ty=(e.y/TILE|0)+dy;if(tx<0||ty<0||tx>=MCOLS||ty>=MROWS)continue;if(MAP[ty][tx]===0)continue;const nx=Math.max(tx*TILE,Math.min(e.x,(tx+1)*TILE)),ny=Math.max(ty*TILE,Math.min(e.y,(ty+1)*TILE));const ddx=e.x-nx,ddy=e.y-ny,d2=ddx*ddx+ddy*ddy;if(d2<e.radius*e.radius){const d=Math.sqrt(d2)||.01;e.x+=ddx/d*(e.radius-d);e.y+=ddy/d*(e.radius-d);ok=false;}}if(ok)break;}}

// Is the player's flashlight pointed at world coords?
function isLooking(wx,wy){
  if(!P.flashOn||P.battery<=0)return false;
  const toA=Math.atan2(wy-P.y,wx-P.x);
  let diff=Math.abs(P.angle-toA);if(diff>Math.PI)diff=Math.PI*2-diff;
  const dist=Math.hypot(P.x-wx,P.y-wy);
  return diff<(dist<TILE*3?.22:.12)&&dist<TILE*9;
}

// Random valid floor tile near a point
function randFloor(nearX,nearY,minD,maxD){
  const cands=[];
  for(let ty=1;ty<MROWS-1;ty++)for(let tx=1;tx<MCOLS-1;tx++){
    if(MAP[ty][tx]!==0)continue;
    const cx=tx*TILE+TILE/2,cy=ty*TILE+TILE/2,d=Math.hypot(cx-nearX,cy-nearY);
    if(d>=minD&&d<=maxD)cands.push([cx,cy]);
  }
  return cands.length?cands[Math.random()*cands.length|0]:null;
}

let parts=[];

function staticBurst(x,y){for(let i=0;i<8;i++){addP(x+(Math.random()-.5)*22,y+(Math.random()-.5)*22,(Math.random()-.5)*2.5,(Math.random()-.5)*2.5,9+Math.random()*8,Math.random()*3+1,`rgba(${200+Math.random()*55|0},${200+Math.random()*55|0},${180+Math.random()*55|0},`,0);}}
function updParts(){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=.95;p.vy*=.95;p.life--;if(p.life<=0)parts.splice(i,1);}}
function drwParts(cx,cy){parts.forEach(p=>{ctx.fillStyle=p.col+(p.life/p.ml).toFixed(2)+')';ctx.beginPath();ctx.arc(p.x-cx,p.y-cy,p.r,0,Math.PI*2);ctx.fill();});}

// ── LOAD LEVEL ────────────────────────────────────────────────────────
function gL(){return Math.max(0,lvlN-1);}
function lurkDur(){
  const base=600+Math.random()*500+Math.max(0,(2-gL()))*400;
  return difficulty==='insane'?base*.18:difficulty==='hard'?base*.45:difficulty==='veryeasy'?base*3.2:difficulty==='easy'?base*1.9:base*.95;
}
function initEnvAnim(n){

    if(MAP[ty][tx]!==0)continue;

  for(let i=0;i<dripN;i++){

    wallDrips.push({wx:(tx+.1+Math.random()*.8)*TILE,wy:ty*TILE,vy:.22+Math.random()*.32,len:10+Math.random()*20,a:.04+Math.random()*.11,maxDy:TILE*.88,dy:Math.random()*TILE*.88,phase:Math.random()*Math.PI*2});

    openFloor.push([tx,ty]);
  }
  for(let i=openFloor.length-1;i>0;i--){const j=Math.random()*i|0;[openFloor[i],openFloor[j]]=[openFloor[j],openFloor[i]];}
  const flickN=Math.min(10,openFloor.length);
  for(let i=0;i<flickN;i++){

function updEnvAnim(){
  if(!LEVELS[lvlN]||LEVELS[lvlN].prelude)return;

function drwEnvAnim(cx,cy){

    const sx=d.wx-cx,sy=d.wy+d.dy-cy;
    if(sx<-20||sx>W+20||sy<-30||sy>H+40)continue;

}

  phantomTimer=200+Math.random()*200;
  exitLocked=false;collectedClues=[];clueMap={};evidenceActive=false;evidenceTimer=0;exitPuzzleActive=false;exitPuzzleResult=null;exitPuzzleInput='';noiseLevel=0;

  keycardFound=false;lockedRoomOpen=false;lockedRoomDoc=null;keycardItem=null;scriptedDone=new Set();visitedTileMap=new Map();figLearnTarget=null;figLearnCd=0;creakCooldown=0;checkpoint=null;checkpointUsesLeft=difficulty==='insane'?2:0;checkpointFlash=0;sneakBreathTimer=0;P.sneaking=false;
  if(!LEVELS[n].prelude&&LEVELS[n].lockedRoom){const lr=LEVELS[n].lockedRoom;keycardItem={x:(lr.keyX+.5)*TILE,y:(lr.keyY+.5)*TILE,taken:false};}

// ── FIGURE AI — psychological horror ─────────────────────────────────
function updFigure(){
  if(LEVELS[lvlN].noFigure)return;
  if(LEVELS[lvlN].useListener)return;
  if(LEVELS[lvlN].safeRoom){
    const sr=LEVELS[lvlN].safeRoom;
    const pTx=Math.floor(P.x/TILE),pTy=Math.floor(P.y/TILE);
    if(pTx>=sr.x1&&pTx<=sr.x2&&pTy>=sr.y1&&pTy<=sr.y2){
      F.state='absent';F.opacity=Math.max(0,F.opacity-.03);return;
    }
  }
  F.opacity+=(F.opTarget-F.opacity)*.07;
  if(F.flickerFr>0){F.flickerFr--;F.opacity=Math.random()>.45?F.opTarget:.05;}

  const dist=Math.hypot(P.x-F.x,P.y-F.y);
  const looking=isLooking(F.x,F.y);

  // Slow turn to face player
  if(F.state!=='absent'){
    const ta=Math.atan2(P.y-F.y,P.x-F.x);
    let da=ta-F.angle;if(da>Math.PI)da-=Math.PI*2;if(da<-Math.PI)da+=Math.PI*2;
    F.angle+=da*.018;
  }

  // Rare proximity breathing
  F.growlCd--;
  if(F.growlCd<=0&&dist<TILE*5&&F.state!=='absent'){
    if(Math.random()<.35)sfxBreathing();
    F.growlCd=500+Math.random()*600;
  }

  // Infrasound when very close
  F.infraCd--;
  if(F.infraCd<=0&&F.state!=='absent'&&dist<TILE*3){
    sfxInfrasound();F.infraCd=280+Math.random()*200;
  }

  if(F.state==='lurk'){
    F.opTarget=1;
    F.lurkTimer--;

    // Micro-jitter: figure twitches slightly while standing — movement without moving
    F.jitterTimer--;
    if(F.jitterTimer<=0&&F.opacity>.6&&!looking){
      F.x+=(Math.random()-.5)*9;F.y+=(Math.random()-.5)*9;resolve(F);
      F.jitterTimer=45+Math.random()*55;
      if(Math.random()<.28)sfxStatic(.009,.06);
    }
    // Figure learns: drift toward corridors the player revisits
    if(figLearnCd>0)figLearnCd--;
    if(figLearnCd<=0&&visitedTileMap.size>0&&Math.random()<.004){
      const hz=[];visitedTileMap.forEach((c,k)=>{if(c>=3){const[hx,hy]=k.split(',').map(Number);hz.push({x:(hx+.5)*TILE,y:(hy+.5)*TILE});}});
      if(hz.length>0){figLearnTarget=hz[Math.floor(Math.random()*hz.length)];figLearnCd=120+Math.random()*80;}
    }
    if(figLearnTarget&&!looking){
      const dtl=Math.hypot(F.x-figLearnTarget.x,F.y-figLearnTarget.y);
      if(dtl<TILE){figLearnTarget=null;}
      else{F.x+=(figLearnTarget.x-F.x)/dtl*.7*_dt;F.y+=(figLearnTarget.y-F.y)/dtl*.7*_dt;resolve(F);}
    }

    // STARE-BACK: very close and player is looking → it doesn't immediately vanish.
    // It stares back. For 1.5 seconds. Then the lights flicker and it goes.
    if(looking&&dist<TILE*4&&F.opacity>.4){
      F.stareTimer++;
      if(F.stareTimer%22===0)glitch=4; // lights flicker while being stared at
      if(F.stareTimer>90){           // ~1.5 seconds — then it vanishes
        F.state='absent';F.opTarget=0;
        F.absentTimer=90+Math.random()*150;
        sfxStatic(.032,.22);glitch=14;F.stareTimer=0;
      }
      return;
    }
    // Further away: instant vanish as before
    if(looking&&dist<TILE*8&&F.opacity>.4){
      F.stareTimer=0;
      F.state='absent';F.opTarget=0;
      F.absentTimer=90+Math.random()*150;
      sfxStatic(.018,.15);glitch=6;
      return;
    }
    F.stareTimer=0;

    // Encroach: when timer expires and not looked at → teleport closer
    if(F.lurkTimer<=0){
      if(!looking){
        const minD=gL()===0?TILE*5:gL()===1?TILE*3.5:TILE*1.8;
        const maxD=TILE*(9-Math.min(F.encroachCount,4+lvlN));
        const pos=randFloor(P.x,P.y,minD,Math.max(minD+TILE,maxD));
        if(pos){
          F.x=pos[0];F.y=pos[1];
          // 30% chance: figure faces AWAY from player — seeing a person turned away is wrong
          const towardPlayer=Math.atan2(P.y-F.y,P.x-F.x);
          F.angle=Math.random()<.30?towardPlayer+Math.PI:towardPlayer;
          F.encroachCount++;
        }
        F.flickerFr=2;sfxTeleport();
        F.lurkTimer=lurkDur();
      } else {
        F.lurkTimer=100;
      }
    }

    // Level 3: goes aggressive when close and sanity is low
    if(gL()===2&&F.encroachCount>=3&&dist<TILE*2&&P.sanity<45){
      F.state='aggressive';sfxFigureScream();
    }

  } else if(F.state==='absent'){
    F.opTarget=0;
    F.absentTimer--;
    if(F.absentTimer<=0){
      const pos=randFloor(P.x,P.y,TILE*5,TILE*13);
      if(pos){F.x=pos[0];F.y=pos[1];}
      F.state='lurk';F.lurkTimer=lurkDur();F.flickerFr=3;F.stareTimer=0;
      if(Math.random()<.45)sfxWhisper();
    }

  } else if(F.state==='aggressive'){
    F.opTarget=1;
    if(looking&&dist<TILE*6){F.state='absent';F.opTarget=0;F.absentTimer=60+Math.random()*80;return;}
    // Stuttering movement — skips every other frame — stop-motion, deeply wrong
    if(fr%2===0){
      const sp=(gL()===2?4.4:3.8)*(difficulty==='insane'?2.3:difficulty==='hard'?1.65:difficulty==='veryeasy'?.45:difficulty==='easy'?.7:.95)*safeRoomPenalty;
      if(dist>1){F.x+=(P.x-F.x)/dist*sp*_dt;F.y+=(P.y-F.y)/dist*sp*_dt;resolve(F);}
    }
    if(fr%14===0&&dist<TILE*8)sfxFigureStep();
    // Contact = instant death, no scream
    if(dist<F.radius+P.radius+4){

}

  ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(14,4);ctx.lineTo(13,33);ctx.lineTo(9,33);ctx.lineTo(8,0);ctx.closePath();ctx.fill();

  ctx.moveTo(11,33);ctx.lineTo(10,41.5);

function drwSafeRoom(cx,cy){

  ctx.fillStyle='rgba(216,192,128,0.88)';ctx.font='bold 26px monospace';ctx.fillText(NL.name,W/2,H/2-22);
  ctx.fillStyle='rgba(162,136,70,0.66)';ctx.font='italic 14px monospace';ctx.fillText(NL.subtitle,W/2,H/2+10);
  if(el>82&&Math.sin(fr*.09)>0){ctx.fillStyle='rgba(188,160,70,0.7)';ctx.font='11px monospace';ctx.fillText('▶ CLICK OR SPACE TO CONTINUE ◀',W/2,H-28);}

}
function drwDead(){
  const el=fr-deadFr;
  const a=Math.min(1,el/52);ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);
  // Brief distorted figure — not a screaming face. Just standing there. Too close.
  if(el>=38&&el<=41){
    // First flash: figure very close, slightly to the side, facing away
    const savedAngle=F.angle;F.angle=Math.PI*.15;
    drwFigure(W/2-18,H/2-18,.55,false);F.angle=savedAngle;
    ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(0,0,W,H);
  }
  if(el>=56&&el<=58){
    // Second flash: closer, slightly different position
    drwFigure(W/2+6,H/2-10,.62,false);
    ctx.fillStyle='rgba(255,0,0,0.02)';ctx.fillRect(0,0,W,H);
  }
  if(el>=70&&el<=71){
    // Third flash: dead center, facing the camera directly
    const savedAngle=F.angle;F.angle=0;
    drwFigure(W/2,H/2-20,.44,false);F.angle=savedAngle;
  }
  if(el<78)return;
  for(let i=0;i<75;i++){ctx.fillStyle=`rgba(182,4,4,${Math.random()*.036})`;ctx.fillRect(Math.random()*W,Math.random()*H,Math.random()*3+1,1);}
  ctx.textAlign='center';
  ctx.fillStyle='rgba(142,0,0,0.9)';ctx.font='bold 56px monospace';ctx.fillText('LOST',W/2,H/2-38);
  ctx.fillStyle='rgba(145,115,68,0.72)';ctx.font='12px monospace';
  [
    'Harris never filed a report.',
    'No one knew he had entered the building.',
    '',
    'The anonymous tip came three weeks before.',
    'The voice on the recording was his own.',
    '',
    'He was not sent there.',
    'He was called there.',
  ].forEach((l,i)=>ctx.fillText(l,W/2,H/2-4+i*16));
  if(Math.sin(fr*.07)>0){ctx.fillStyle='rgba(188,160,70,0.6)';ctx.font='11px monospace';ctx.fillText('▶ CLICK OR SPACE TO TRY AGAIN ◀',W/2,H/2+142);}

}
function drwWin(){

function drwCredits(){
  ctx.fillStyle='rgba(0,0,0,0.92)';ctx.fillRect(0,0,W,H);
  ctx.drawImage(scanC,0,0);
  ctx.textAlign='center';

}

// ── EVIDENCE DISPLAY OVERLAY — shown on tape pickup for 15s ───────────
function drwEvidence(){
  if(!evidenceActive||gs!=='playing')return;
  const bw=520,bh=340,bx=W/2-260,by=H/2-170;
  ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(8,6,3,0.97)';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(182,148,50,0.70)';ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);
  ctx.textAlign='center';
  ctx.fillStyle='rgba(188,150,50,0.90)';ctx.font='bold 11px monospace';
  ctx.fillText('▶ EVIDENCE RECOVERED — CIPHER CLUES FOUND',W/2,by+22);
  ctx.strokeStyle='rgba(182,148,50,0.22)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(bx+14,by+32);ctx.lineTo(bx+bw-14,by+32);ctx.stroke();
  const rawMsg=evidenceMsg.replace(/^▶ TAPE \d+.*? — /,'');
  ctx.fillStyle='rgba(178,148,90,0.70)';ctx.font='9px monospace';ctx.fillText('FIELD RECORDING:',W/2,by+48);
  ctx.fillStyle='rgba(200,180,140,0.78)';ctx.font='italic 10px monospace';
  const wds=rawMsg.split(' ');let ln='',lns=[];
  for(const w of wds){if((ln+w).length>60){lns.push(ln.trim());ln='';}ln+=w+' ';}if(ln.trim())lns.push(ln.trim());
  lns.slice(0,2).forEach((l,i)=>ctx.fillText(l,W/2,by+62+i*13));
  ctx.strokeStyle='rgba(182,148,50,0.22)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(bx+14,by+94);ctx.lineTo(bx+bw-14,by+94);ctx.stroke();
  ctx.fillStyle='rgba(138,208,138,0.90)';ctx.font='bold 11px monospace';
  ctx.fillText('NEW CIPHER CLUES:',W/2,by+112);
  const perRow=3;const evRows=[];
  for(let i=0;i<evidenceClues.length;i+=perRow)evRows.push(evidenceClues.slice(i,i+perRow));
  evRows.forEach((row,ri)=>{row.forEach((cl,ci)=>{
    const cx2=W/2+(ci-(row.length-1)/2)*100,cy2=by+122+ri*52;
    ctx.fillStyle='rgba(18,28,18,0.90)';ctx.fillRect(cx2-38,cy2,76,36);
    ctx.strokeStyle='rgba(88,188,88,0.55)';ctx.lineWidth=1;ctx.strokeRect(cx2-38,cy2,76,36);
    ctx.fillStyle='rgba(138,218,138,0.95)';ctx.font='bold 20px monospace';ctx.fillText(cl,cx2,cy2+24);
  });});
  const tp=evidenceTimer/900;
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(bx+20,by+bh-40,bw-40,10);
  ctx.fillStyle=tp>.5?'rgba(60,148,60,0.82)':tp>.25?'rgba(188,148,30,0.82)':'rgba(188,40,40,0.82)';
  ctx.fillRect(bx+20,by+bh-40,(bw-40)*tp,10);
  ctx.strokeStyle='rgba(182,148,50,0.28)';ctx.strokeRect(bx+20,by+bh-40,bw-40,10);
  ctx.fillStyle='rgba(188,160,70,0.65)';ctx.font='9px monospace';
  ctx.fillText('[ ENTER ] TO RESUME  —  AUTO IN '+Math.ceil(evidenceTimer/60)+'s',W/2,by+bh-22);
  ctx.fillStyle='rgba(148,128,80,0.55)';ctx.font='7px monospace';
  ctx.fillText('MEMORIZE THESE CLUES — YOU WILL NEED THEM AT THE EXIT',W/2,by+bh-8);
  ctx.drawImage(scanC,0,0);
}

// ── EXIT CIPHER PUZZLE — 3 minutes to decode the word ─────────────────
function drwExitPuzzle(){
  if(!exitPuzzleActive||gs!=='playing')return;
  const bw=560,bh=280,bx=W/2-280,by=H/2-140;
  ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(6,4,2,0.97)';ctx.fillRect(bx,by,bw,bh);
  const wFlash=exitWrongFlash>0&&exitWrongFlash%4<2;
  ctx.strokeStyle=exitPuzzleResult==='correct'?'rgba(70,195,70,0.75)':wFlash?'rgba(200,40,40,0.90)':'rgba(182,148,50,0.65)';
  ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);
  ctx.textAlign='center';
  ctx.fillStyle='rgba(188,150,50,0.90)';ctx.font='bold 11px monospace';
  ctx.fillText('▶ EXIT CIPHER — USE YOUR CLUES TO DECODE',W/2,by+20);
  ctx.strokeStyle='rgba(182,148,50,0.22)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(bx+14,by+30);ctx.lineTo(bx+bw-14,by+30);ctx.stroke();
  const enc=LEVELS[lvlN].encodedWord,clen=enc.length;
  enc.split('').forEach((ch,i)=>{
    const ex2=W/2+(i-(clen-1)/2)*64;
    const fl=wFlash;
    ctx.fillStyle=fl?'rgba(60,8,8,0.9)':'rgba(22,16,6,0.9)';ctx.fillRect(ex2-24,by+44,48,36);
    ctx.strokeStyle=fl?'rgba(200,40,40,0.8)':'rgba(188,148,50,0.55)';ctx.lineWidth=1;ctx.strokeRect(ex2-24,by+44,48,36);
    ctx.fillStyle=fl?'rgba(218,80,80,0.95)':'rgba(218,182,78,0.95)';ctx.font='bold 22px monospace';
    ctx.fillText(ch,ex2,by+68);
    const inputCh=exitPuzzleInput[i]||'',cur=i===exitPuzzleInput.length&&fr%60<36;
    ctx.fillStyle=inputCh?'rgba(18,38,18,0.9)':'rgba(8,12,8,0.9)';ctx.fillRect(ex2-24,by+100,48,36);
    ctx.strokeStyle=inputCh?'rgba(80,180,80,0.55)':'rgba(40,68,40,0.3)';ctx.lineWidth=1;ctx.strokeRect(ex2-24,by+100,48,36);
    ctx.fillStyle=inputCh?'rgba(128,218,128,0.95)':cur?'rgba(218,218,128,0.8)':'rgba(40,58,40,0.5)';
    ctx.font='bold 22px monospace';ctx.fillText(inputCh||(cur?'▮':'_'),ex2,by+124);
  });
  ctx.strokeStyle='rgba(182,148,50,0.18)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(bx+14,by+148);ctx.lineTo(bx+bw-14,by+148);ctx.stroke();
  if(exitPuzzleResult===null){
    const maxT=difficulty==='veryeasy'||difficulty==='godmode'?28800:difficulty==='easy'?21600:difficulty==='insane'?2700:difficulty==='hard'?5400:10800;const tp=exitPuzzleTimer/maxT;
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(bx+20,by+158,bw-40,10);
    ctx.fillStyle=tp>.5?'rgba(70,155,70,0.82)':tp>.2?'rgba(195,155,35,0.82)':'rgba(195,45,45,0.82)';
    ctx.fillRect(bx+20,by+158,(bw-40)*tp,10);
    ctx.strokeStyle='rgba(182,148,50,0.28)';ctx.strokeRect(bx+20,by+158,bw-40,10);
    const secs=Math.ceil(exitPuzzleTimer/60),mm=Math.floor(secs/60),ss=(secs%60).toString().padStart(2,'0');
    ctx.fillStyle='rgba(188,160,70,0.65)';ctx.font='9px monospace';ctx.fillText(`${mm}:${ss} REMAINING`,W/2,by+178);
    ctx.fillStyle='rgba(188,70,70,0.70)';ctx.font='8px monospace';
    ctx.fillText('WARNING: THE FIGURE IS STILL MOVING',W/2,by+192);
  }
  if(exitPuzzleResult==='correct'){ctx.fillStyle='rgba(70,210,70,0.95)';ctx.font='bold 16px monospace';ctx.fillText('✓  ACCESS GRANTED',W/2,by+bh-18);}
  ctx.drawImage(scanC,0,0);
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────
function loop(now=performance.now()){
  _dt=_lastT?Math.min((now-_lastT)/16.667,2.5):1;_lastT=now;
  fr++;
  ambT++;if(ambT>=192){ambT=0;if(A.state==='running')tickAmb();}
  if(gs==='playing'&&!paused){
    updPlayer();
    if(!evidenceActive){updFigure();updListener();updGhost();updPhantom();updEnv();updParts();updRain();updThunder();updNoise();updEnvAnim();}
    else{updParts();}
    camX=Math.max(0,Math.min(MCOLS*TILE-W,P.x-W/2));
    camY=Math.max(0,Math.min(MROWS*TILE-H,P.y-H/2));
    if(shk>0){skx=(Math.random()-.5)*shk*2;sky=(Math.random()-.5)*shk*2;shk*=.78;if(shk<.16){shk=0;skx=0;sky=0;}}
  }
  if(gs==='intro'){drwIntro();requestAnimationFrame(loop);return;}
  if(gs==='settings'){drwSettings();requestAnimationFrame(loop);return;}
  if(gs==='title'){drwTitle();requestAnimationFrame(loop);return;}
  if(gs==='help'){drwHelp();requestAnimationFrame(loop);return;}
  if(gs==='transition'){drwTransition();requestAnimationFrame(loop);return;}
  ctx.save();if(shk>0)ctx.translate(skx,sky);
  ctx.fillStyle='#0d0a07';ctx.fillRect(0,0,W,H);
  if(mapCache)ctx.drawImage(mapCache,-camX,-camY);
  drwSafeRoom(camX,camY);drwEnv(camX,camY);drwEnvAnim(camX,camY);drwTapes(camX,camY);drwDocs(camX,camY);drwBatts(camX,camY);drwKeycard(camX,camY);drwLockedDoor(camX,camY);drwExit(camX,camY);
  // VHS ghost: 1-2 frame flash of a figure that isn't there (not on Listener levels)
  if(ghostFr>0&&!LEVELS[lvlN]?.useListener){ghostFr--;drwFigure(ghostX-camX,ghostY-camY,.18+Math.random()*.1,true);ctx.fillStyle='rgba(205,195,178,0.03)';ctx.fillRect(ghostX-camX-30,ghostY-camY-40,60,80);}
  // The figure (only on non-Listener levels)
  if(F.opacity>.02&&!LEVELS[lvlN]?.useListener){const fsx=F.x-camX,fsy=F.y-camY;if(fsx>-60&&fsx<W+60&&fsy>-60&&fsy<H+60)drwFigure(fsx,fsy,F.opacity,false);}
  if(LEVELS[lvlN]&&LEVELS[lvlN].useListener&&LIS.opacity>.02){const lsx=LIS.x-camX,lsy=LIS.y-camY;if(lsx>-60&&lsx<W+60&&lsy>-60&&lsy<H+60)drwListener(lsx,lsy,LIS.opacity);}
  drwPlayer(P.x-camX,P.y-camY);drwParts(camX,camY);
  drwRain();
  if(lightningFlash>0){lightningFlash--;ctx.fillStyle=`rgba(210,225,255,${lightningFlash*.07})`;ctx.fillRect(0,0,W,H);}
  drawLight(P.x-camX,P.y-camY,P.angle,P.battery,P.flashOn);
  // Sanity distortion
  const sf=1-P.sanity/100;
  if(sf>.18){const sv=ctx.createRadialGradient(W/2,H/2,W*.12,W/2,H/2,W*.76);sv.addColorStop(0,'rgba(0,0,0,0)');sv.addColorStop(1,`rgba(${14+sf*40|0},0,0,${sf*.54})`);ctx.fillStyle=sv;ctx.fillRect(0,0,W,H);if(sf>.5&&Math.random()<sf*.32){ctx.fillStyle=`rgba(172,0,0,${sf*.048})`;for(let n=0;n<4;n++)ctx.fillRect(0,Math.random()*H,W,2);}}
  // Red proximity warning — intensifies as the figure closes in (not on Listener levels)
  if(!LEVELS[lvlN]?.useListener){
    const figDist=Math.hypot(P.x-F.x,P.y-F.y);
    if(F.state!=='absent'&&F.opacity>.1&&figDist<TILE*5.5){
      const prox=Math.pow(1-figDist/(TILE*5.5),1.5);
      const pg=ctx.createRadialGradient(W/2,H/2,W*.15,W/2,H/2,W*.72);
      pg.addColorStop(0,'rgba(0,0,0,0)');pg.addColorStop(1,`rgba(180,0,0,${(prox*.5).toFixed(3)})`);
      ctx.fillStyle=pg;ctx.fillRect(0,0,W,H);
    }
  }
  if(LEVELS[lvlN]&&LEVELS[lvlN].useListener&&LIS.state==='alerted'){
    const lisDist=Math.hypot(P.x-LIS.x,P.y-LIS.y);
    if(lisDist<TILE*6){
      const prox2=Math.pow(1-lisDist/(TILE*6),1.5);
      const pg2=ctx.createRadialGradient(W/2,H/2,W*.15,W/2,H/2,W*.72);
      pg2.addColorStop(0,'rgba(0,0,0,0)');pg2.addColorStop(1,`rgba(120,0,200,${(prox2*.45).toFixed(3)})`);
      ctx.fillStyle=pg2;ctx.fillRect(0,0,W,H);
    }
  }
  if(gs!=='dead'&&gs!=='win'){drwAnalogue();drwHUD();if(difficulty==='veryeasy')drwMiniMap();drwCheckpointFlash();drwEvidence();drwExitPuzzle();}
  if(paused){
    ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(188,160,70,0.92)';ctx.font='bold 28px monospace';ctx.textAlign='center';
    ctx.fillText('PAUSED',W/2,H/2-12);
    ctx.fillStyle='rgba(145,120,55,0.68)';ctx.font='10px monospace';
    ctx.fillText('PRESS  P  OR  ESC  TO  RESUME',W/2,H/2+14);
  }
  if(notesOpen)drwNotes();
  ctx.restore();
  // Dead/Win drawn AFTER restore — no camera shake offset can create gaps
  if(gs==='dead')drwDead();
  if(gs==='win'){drwWin();if(creditsActive)drwCredits();}
  c.style.cursor=gs==='playing'?'none':'default';
  requestAnimationFrame(loop);
}
loop();
